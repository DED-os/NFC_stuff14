<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>.</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: black;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            cursor: pointer;
        }
        #hint {
            color: #222;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            user-select: none;
            z-index: 10;
        }
        #screamer-container {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        #screamer-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            animation: shake 0.08s infinite;
        }
        @keyframes shake {
            0% { transform: translate(0, 0); }
            25% { transform: translate(-5px, 5px); }
            50% { transform: translate(5px, -5px); }
            75% { transform: translate(-5px, -5px); }
            100% { transform: translate(5px, 5px); }
        }
    </style>
</head>
<body>

    <div id="hint">●</div>

    <div id="screamer-container">
        <img src="crazy_cat.png" alt="">
    </div>

    <audio id="scream" src="848191_miniiteayetagain_scream.mp3" preload="auto"></audio>

    <script>
        var hint = document.getElementById('hint');
        var screamerContainer = document.getElementById('screamer-container');
        var screamAudio = document.getElementById('scream');
        var isActivated = false;

        function activateScreamer() {
            if (isActivated) return;
            isActivated = true;

            hint.style.display = 'none';
            screamerContainer.style.display = 'block';

            screamAudio.play().catch(function(err) {
                console.log('Sound error:', err);
            });
        }

        document.body.addEventListener('click', activateScreamer);
        document.body.addEventListener('touchstart', activateScreamer);
    </script>
</body>
</html>
