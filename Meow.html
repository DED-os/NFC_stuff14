<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>.</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: black;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            cursor: pointer;
        }
        #trigger {
            color: #333;
            font-family: Arial, sans-serif;
            font-size: 14px;
            text-align: center;
            z-index: 10;
            user-select: none;
        }
        #screamer-container {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        #screamer-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            animation: shake 0.1s infinite;
        }
        @keyframes shake {
            0% { transform: translate(0, 0); }
            25% { transform: translate(-5px, 5px); }
            50% { transform: translate(5px, -5px); }
            75% { transform: translate(-5px, -5px); }
            100% { transform: translate(5px, 5px); }
        }
    </style>
</head>
<body>
    <div id="trigger">●</div>

    <div id="screamer-container">
        <img src="crazy_cat.png" alt="">
    </div>

    <audio id="scream" src="848191_miniiteayetagain_scream.mp3" preload="auto"></audio>

    <script>
        var triggered = false;
        var body = document.body;
        var triggerDiv = document.getElementById('trigger');
        var screamerDiv = document.getElementById('screamer-container');
        var audio = document.getElementById('scream');

        function activate() {
            if (triggered) return;
            triggered = true;

            triggerDiv.style.display = 'none';
            screamerDiv.style.display = 'block';
            audio.play();
        }
        body.addEventListener('click', activate);
        body.addEventListener('touchstart', activate);
    </script>
</body>
</html>
