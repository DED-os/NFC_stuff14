<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>.</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Courier New', monospace;
        }
        #start-screen {
            text-align: center;
            z-index: 10;
        }
        #start-btn {
            background: transparent;
            color: #1a1a1a;
            border: 1px solid #1a1a1a;
            padding: 12px 36px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            letter-spacing: 6px;
            cursor: pointer;
            background: none;
            outline: none;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        #screamer-container {
            display: none;
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
        }
        #screamer-container img {
            width: 100%; height: 100%;
            object-fit: cover;
            animation: shake 0.08s infinite;
        }
        @keyframes shake {
            0% { transform: translate(0,0); }
            25% { transform: translate(-6px,6px); }
            50% { transform: translate(6px,-6px); }
            75% { transform: translate(-6px,-6px); }
            100% { transform: translate(6px,6px); }
        }
    </style>
</head>
<body>

    <div id="start-screen">
        <button id="start-btn">В О Й Т И</button>
    </div>

    <div id="screamer-container">
        <img src="crazy_cat.png" alt="">
    </div>

    <audio id="scream" src="848191_miniiteayetagain_scream.mp3" preload="auto"></audio>

    <script>
        var startScreen = document.getElementById('start-screen');
        var screamerContainer = document.getElementById('screamer-container');
        var screamAudio = document.getElementById('scream');
        var startBtn = document.getElementById('start-btn');

        startBtn.addEventListener('click', function(event) {
            event.stopPropagation();
            startScreen.style.display = 'none';
            screamerContainer.style.display = 'block';
            screamAudio.play();
        });
    </script>
</body>
</html>
