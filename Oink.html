<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>.</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            font-family: 'Courier New', monospace;
        }
        #fullscreen-btn {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: transparent;
            border: none;
            outline: none;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            color: #1a1a1a;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            letter-spacing: 6px;
            z-index: 10;
            user-select: none;
        }
        #screamer-container {
            display: none;
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
        }
        #screamer-container img {
            width: 100%; height: 100%;
            object-fit: cover;
            animation: shake 0.08s infinite;
        }
        @keyframes shake {
            0% { transform: translate(0,0); }
            25% { transform: translate(-6px,6px); }
            50% { transform: translate(6px,-6px); }
            75% { transform: translate(-6px,-6px); }
            100% { transform: translate(6px,6px); }
        }
    </style>
</head>
<body>

    <button id="fullscreen-btn">●</button>

    <div id="screamer-container">
        <img src="svintus.png" alt="">
    </div>

    <audio id="scream" src="849573_pumiquxt_elephant-screaming-0-25.mp3" preload="auto"></audio>

    <script>
        var btn = document.getElementById('fullscreen-btn');
        var screamerContainer = document.getElementById('screamer-container');
        var screamAudio = document.getElementById('scream');
        var isActivated = false;

        btn.addEventListener('click', function(event) {
            event.stopPropagation();
            if (isActivated) return;
            isActivated = true;

            btn.style.display = 'none';
            screamerContainer.style.display = 'block';
            screamAudio.play();
        });
    </script>
</body>
</html>
